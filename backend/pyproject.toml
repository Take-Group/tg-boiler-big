[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-playground-backend"
version = "0.1.0"
description = "TG Playground Backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1.1",
    "asyncpg>=0.31",
    "alembic>=1.20.0",
    "redis>=8.1",
    "temporalio>=1.33",
    "structlog>=26.1",
    "httpx>=0.28.1",
]

[project.scripts]
serve = "app.main:run"
worker = "app.temporal.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.flake8-type-checking]
# FastAPI ewaluuje adnotacje w runtime — importy typów z collections.abc muszą zostać poza TYPE_CHECKING
exempt-modules = ["typing", "collections.abc"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
